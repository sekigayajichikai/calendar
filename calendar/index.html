<style>*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; font-size: 16px; line-height: 1.5; color: #333; background: #f9f9f9; padding: 12px; }
.header { text-align: center; margin-bottom: 12px; }
.header h1 { font-size: 1.3em; margin-bottom: 4px; }
.nav-links { display: flex; justify-content: center; gap: 12px; margin-bottom: 16px; }
.nav-links a { color: #1a73e8; text-decoration: none; font-size: 0.95em; padding: 6px 16px; border: 1px solid #1a73e8; border-radius: 6px; }
.nav-links a:hover { background: #e8f0fe; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; justify-content: center; }
.tab { padding: 8px 16px; border: 2px solid #ddd; border-radius: 8px; background: #fff; cursor: pointer; font-family: inherit; font-size: 0.95em; }
.tab.active { border-color: #1a73e8; background: #1a73e8; color: #fff; }
.cal-panel { display: none; }
.cal-panel.active { display: block; }
.cal-panel iframe { width: 100%; height: 600px; border: 1px solid #ddd; border-radius: 8px; }
@media (max-width: 767px) {
  .tab { padding: 6px 12px; font-size: 0.85em; }
  .cal-panel iframe { height: 450px; }
}
.footer { text-align: center; padding: 16px 0; border-top: 1px solid #ddd; margin-top: 24px; font-size: 0.85em; color: #999; }</style>
</head>

<script>(function() {
  var tabs = document.querySelectorAll(".tab");
  var panels = document.querySelectorAll(".cal-panel");
  tabs.forEach(function(tab) {
    tab.addEventListener("click", function() {
      var idx = this.dataset.index;
      tabs.forEach(function(t) { t.classList.remove("active"); });
      panels.forEach(function(p) { p.classList.remove("active"); });
      this.classList.add("active");
      document.querySelector(".cal-panel[data-index=\"" + idx + "\"]").classList.add("active");
    });
  });
})();</script>
