function getMonday(d) {
  var date = new Date(d);
  var day = date.getDay();
  var diff = day === 0 ? -6 : 1 - day;
  date.setDate(date.getDate() + diff);
  date.setHours(0,0,0,0);
  return date;
}

function formatDate(d) {
  return d.getFullYear() + "-" + ("0"+(d.getMonth()+1)).slice(-2) + "-" + ("0"+d.getDate()).slice(-2);
}

  var endDate = new Date(startDate);

    html += "<div class=\"" + headerClass + "\">";
    html += "<span>" + (date.getMonth()+1) + "/" + date.getDate() + " (" + DOW[dow] + ")" + (isToday ? " 今日" : "") + "</span>";
    if (badge) html += "<span class=\"badge\">" + badge + "</span>";
    html += "</div>";

    if (dayEvents.length === 0) {
      html += "<div class=\"no-events\">予定なし</div>";
    } else {
      for (var j = 0; j < dayEvents.length; j++) {
        var ev = dayEvents[j];
        var timeStr = ev.allDay ? "終日" : (ev.start + "-" + ev.end);
        var venueClass = "venue-other";
        if (ev.venue === "自治会館") venueClass = "venue-kaikan";
        else if (ev.venue === "コミュニティハウス") venueClass = "venue-community";

        html += "<div class=\"event-item\">";
        html += "<div class=\"event-time\">" + timeStr + "</div>";
        html += "<div class=\"event-title\">" + ev.title + "</div>";
        html += "<div class=\"event-detail\">";
        html += "<span class=\"event-venue " + venueClass + "\">" + ev.venue + "</span>";
        if (ev.room) html += " " + ev.room;
        if (ev.org) html += " / " + ev.org;
        html += "</div>";
        html += "</div>";
      }
    }
    html += "</div>";
  }
  container.innerHTML = html;
}

document.getElementById("prevWeek").addEventListener("click", function() {
  currentWeekStart.setDate(currentWeekStart.getDate() - 7);
  renderWeek(currentWeekStart);
});
document.getElementById("nextWeek").addEventListener("click", function() {
  currentWeekStart.setDate(currentWeekStart.getDate() + 7);
  renderWeek(currentWeekStart);
});
document.getElementById("todayBtn").addEventListener("click", function() {
  renderWeek(getMonday(new Date()));
});

renderWeek(getMonday(new Date()));
</script>
</body></html>
